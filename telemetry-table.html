<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos Defense: live telem table</title>
<script>if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E3E8EF;--panel:#F2F5F9;--line:#C3CCD9;--text:#0D1828;--muted:#55657C;
  --accent:#08837A;--amber:#A35F00;--chip:#0D1828;--chip-ink:#F2F5F9;
  --row:#F2F5F9;--row-alt:#EBEFF5;--fresh:rgba(8,131,122,.10);
  --sans:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#07101C;--panel:#0C1727;--line:#1B2940;--text:#D9E5F5;--muted:#7C8FAB;
    --accent:#5FF2E0;--amber:#FFB547;--chip:#D9E5F5;--chip-ink:#07101C;
    --row:#0C1727;--row-alt:#0A1422;--fresh:rgba(95,242,224,.08);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07101C;--panel:#0C1727;--line:#1B2940;--text:#D9E5F5;--muted:#7C8FAB;
  --accent:#5FF2E0;--amber:#FFB547;--chip:#D9E5F5;--chip-ink:#07101C;
  --row:#0C1727;--row-alt:#0A1422;--fresh:rgba(95,242,224,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}

.bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-weight:700;font-size:18px;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:15px;white-space:nowrap}
.brand svg{flex:none;color:var(--muted)}
.link{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap;color:var(--muted);border:1px solid var(--line)}
.link.up{color:var(--accent);border-color:currentColor}
.link.up::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.navlink{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.navlink:hover{text-decoration:underline}

main{padding:14px 16px 24px;container-type:inline-size}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 18px;align-items:center}
.lead h1{margin:0;font:600 30px/1 var(--mono);font-stretch:85%;letter-spacing:-.01em}
.lead p{margin:6px 0 0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;min-width:0;max-width:560px}
.kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px 8px;min-width:0}
.kpi dt,.kpi .v,.kpi .d{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi dt{font-size:12.5px;color:var(--muted)}
.kpi dd{margin:0}
.kpi .v{font-size:24px;font-weight:600;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi .d.behind{color:var(--amber)}
.kpi .sp{position:absolute;right:14px;bottom:0;width:44%;height:64%;pointer-events:none}
.kpi svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kpi .l{fill:none;stroke:var(--accent);stroke-width:1.75;opacity:.8;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.kpi .dot{position:absolute;right:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2px var(--panel);transform:translateY(-50%);display:none}

.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{font:600 14px var(--sans);background:var(--chip);color:var(--chip-ink);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;min-width:92px}
.btn.paused{background:var(--amber);color:var(--chip-ink)}
.sel{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}
.sel select{font:600 14px var(--sans);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.off{margin:16px 0 0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.off code{font:400 13px var(--mono);font-stretch:85%;color:var(--text)}
.off[hidden]{display:none}

.wrap{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--row)}
table{border-collapse:collapse;width:100%;font:400 12.5px/1 var(--mono);font-stretch:85%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;background:var(--panel);color:var(--muted);font:600 13px/1 var(--sans);text-align:left;
  padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th small{font-weight:400;margin-left:5px;opacity:.8}
td{padding:5px 8px;white-space:nowrap;height:24px}
th:first-child,td:first-child{padding-left:12px}
th:last-child,td:last-child{padding-right:12px}
th.n,td.n{text-align:right}
tbody tr:nth-child(even){background:var(--row-alt)}
tbody tr.fresh{background:var(--fresh)}
tbody tr.fresh td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr[hidden]{display:none}
td.i{color:var(--muted)}

@container (max-width:900px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .kpis{grid-column:1/-1;grid-row:2;max-width:none}
}
@container (max-width:520px){
  .top{grid-template-columns:1fr}
  .controls{justify-content:flex-start}
}
@media (max-width:640px){.brand .sub{display:none}}
/* inside the wall's "Live table" view: the wall already shows the header and the rate tiles */
.embed .bar,.embed .kpis{display:none}
.embed main{padding:0 0 2px}
.embed .lead h1{font-size:24px}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 10 L10 1.5 A8.5 8.5 0 0 1 17.36 5.75 Z" style="fill:var(--accent)"/></svg>
    <b>Kairos Defense</b><span class="sub">Live telem table</span>
  </div>
  <span class="link" id="link">Looking for q</span>
  <a class="navlink" href="telemetry-wall.html">← Telemetry wall</a>
</header>

<main>
  <div class="top">
    <div class="lead">
      <h1>telem</h1>
      <p id="caption">Waiting for q…</p>
    </div>
    <dl class="kpis" aria-label="Live q rates">
      <div class="kpi">
        <dt>Rows per second</dt>
        <dd class="v" id="rps">–</dd>
        <dd class="d" id="rpsD"></dd>
        <dd class="sp" title="Measured rows per second into the RDB over the last 60 seconds"><svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" id="rpsS"><path class="l"/></svg><i class="dot"></i></dd>
      </div>
      <div class="kpi">
        <dt>Metrics per second</dt>
        <dd class="v" id="mps">–</dd>
        <dd class="d" id="mpsD"></dd>
        <dd class="sp" title="Metrics per second (drones × sample rate × columns) over the last 60 seconds"><svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" id="mpsS"><path class="l"/></svg><i class="dot"></i></dd>
      </div>
    </dl>
    <div class="controls">
      <button class="btn" id="pause" type="button" title="Space bar">Pause</button>
      <label class="sel">Updates <select id="ups"><option value="5">5/s</option><option value="10" selected>10/s</option><option value="20">20/s</option><option value="30">30/s</option></select></label>
      <label class="sel">Rows <select id="nrows"><option>25</option><option selected>50</option><option>100</option></select></label>
    </div>
  </div>

  <p class="off" id="off" hidden>q isn't running on :5011. Start it from the kit folder with <code>./start.sh</code>; this page reconnects on its own.</p>

  <div class="wrap">
    <table aria-label="Newest rows in telem, newest first">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>

<script>
(() => {
const Q_URL='ws://localhost:5011', MAXN=100, HIST_MS=60000;
const UNITS={alt:'m',ias:'m/s',imuz:'g'};
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');
function fmtSI(n){for(const [d,s] of [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']]) if(n>=d){const v=n/d;
  return (v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+s;} return String(Math.round(n));}
const fmtC=n=>n<1e7?fmt(n):fmtSI(n);
// show reals the way q prints them: 7 significant digits
const cell=v=>typeof v==='number'?(Number.isInteger(v)?String(v):String(+v.toPrecision(7))):String(v);

let ws=null, qUp=false, paused=false, inflight=0, prevTotal=-1, cols=[];
let active=true;  // the wall turns this off while its "Wall" view is showing, so a hidden table doesn't poll q
addEventListener('message',e=>{if(e.data&&typeof e.data.active==='boolean'){active=e.data.active;prevTotal=-1;}});
let ups=10, nrows=50, hist=[];

/* ---- table: rows built once, then only their text changes ---- */
const body=$('body'), rowEls=[];
for(let i=0;i<MAXN;i++){const tr=document.createElement('tr');tr.hidden=true;body.appendChild(tr);rowEls.push(tr);}
function buildHead(keys,sample){
  cols=keys;
  $('head').innerHTML='<th class="n">#</th>'+keys.map(k=>`<th class="${typeof sample[k]==='number'?'n':''}">${k}${UNITS[k]?`<small>${UNITS[k]}</small>`:''}</th>`).join('');
  for(const tr of rowEls){tr.innerHTML='<td class="n i"></td>'+keys.map(k=>`<td class="${typeof sample[k]==='number'?'n':''}"></td>`).join('');}
}
function renderRows(m){
  const rows=m.rows||[];
  if(rows.length&&(cols.length!==Object.keys(rows[0]).length||cols.some((k,i)=>k!==Object.keys(rows[0])[i]))) buildHead(Object.keys(rows[0]),rows[0]);
  // rows that arrived since the last update get a tint; a restart or clear marks them all
  const fresh=prevTotal<0?0:m.total<prevTotal?rows.length:Math.min(rows.length,m.total-prevTotal);
  prevTotal=m.total;
  for(let i=0;i<MAXN;i++){
    const tr=rowEls[i], r=rows[i];
    if(!r||i>=nrows){tr.hidden=true;continue;}
    tr.hidden=false;tr.classList.toggle('fresh',i<fresh);
    const td=tr.children;td[0].textContent=i+1;
    for(let c=0;c<cols.length;c++) td[c+1].textContent=cell(r[cols[c]]);
  }
  $('caption').textContent=`Newest ${fmt(Math.min(nrows,rows.length))} of ${fmt(m.held)} rows, newest first`+(paused?' · paused':'');
}

/* ---- tiles: rows/s = drones × Hz, metrics/s = rows/s × columns, as configured in q; the line under rows/s is measured ---- */
function spark(id,key,now){
  const svg=$(id),line=svg.querySelector('.l'),dot=svg.parentNode.querySelector('.dot');
  if(hist.length<2){line.removeAttribute('d');dot.style.display='none';return;}
  let hi=0;for(const h of hist) hi=Math.max(hi,h[key]);
  const t0=now-HIST_MS, X=h=>((h.t-t0)/HIST_MS*100).toFixed(2), Y=v=>hi===0?36:36-v/hi*32;
  let d='';hist.forEach((h,i)=>{d+=(i?'L':'M')+X(h)+' '+Y(h[key]).toFixed(2);});
  line.setAttribute('d',d);dot.style.display='block';dot.style.top=(Y(hist[hist.length-1][key])/40*100)+'%';
}
function renderStats(q){
  const now=performance.now(), rps=q.n*q.hz, mps=rps*q.ncols;
  hist.push({t:now,rate:q.rate,mps});while(hist.length&&hist[0].t<now-HIST_MS) hist.shift();
  $('rps').textContent=fmtC(rps);$('rps').title=fmt(rps);
  const d=$('rpsD');d.textContent=`Measured ${fmtSI(q.rate)}/s`;d.classList.toggle('behind',q.demand>0&&q.rate<0.9*q.demand);
  $('mps').textContent=fmtC(mps);$('mps').title=fmt(mps);
  $('mpsD').textContent=`${fmtSI(q.n)} × ${fmt(q.hz)} Hz × ${q.ncols} cols`;
  $('mpsD').title=`${fmt(q.n)} drone${q.n===1?'':'s'} × ${fmt(q.hz)} Hz × ${q.ncols} columns`;
  spark('rpsS','rate',now);spark('mpsS','mps',now);
}

/* ---- link to q: stats arrive every 250 ms on their own; rows are asked for at the chosen pace ---- */
function setLink(up){
  const el=$('link');el.classList.toggle('up',up);
  el.textContent=up?'Reading q on :5011':'q not running on :5011';
  $('off').hidden=up;
}
function connect(){
  try{ws=new WebSocket(Q_URL);}catch(_){setTimeout(connect,3000);return;}
  ws.onopen=()=>{qUp=true;setLink(true);};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}
    if(m.type==='last'){inflight=0;if(!paused) renderRows(m);}
    else if(m.type==='stats') renderStats(m);
    else if(m.type==='cleared'){hist=[];prevTotal=-1;}};
  ws.onclose=()=>{qUp=false;ws=null;inflight=0;hist=[];prevTotal=-1;setLink(false);setTimeout(connect,3000);};
  ws.onerror=()=>{};
}
// a timer, not requestAnimationFrame, so the table keeps up even when the window isn't in front
let timer=0;
function pump(){
  const now=performance.now();
  if(inflight&&now-inflight>2000) inflight=0;  // a reply went missing; ask again
  if(active&&qUp&&!paused&&!inflight&&ws&&ws.readyState===1){inflight=now;ws.send(JSON.stringify({cmd:'last',n:nrows}));}
}
function schedule(){clearInterval(timer);timer=setInterval(pump,1000/ups);}

/* ---- controls ---- */
function setPaused(p){
  paused=p;const b=$('pause');b.textContent=p?'Resume':'Pause';b.classList.toggle('paused',p);
  const c=$('caption');c.textContent=c.textContent.replace(/ · paused$/,'')+(p?' · paused':'');
}
$('pause').onclick=()=>setPaused(!paused);
document.addEventListener('keydown',e=>{
  if(e.key===' '&&!(e.target.closest&&e.target.closest('select,button,input'))){e.preventDefault();setPaused(!paused);}
});
$('ups').onchange=e=>{ups=+e.target.value;schedule();};
$('nrows').onchange=e=>{nrows=+e.target.value;prevTotal=-1;};

setLink(false);$('off').hidden=true;connect();schedule();
})();
</script>
</body>
</html>
